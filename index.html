<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liceo Rugby Club</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <h1>🏉 Liceo Rugby</h1>
  </div>

  <div class="nav-right">
    <a href="index.html" class="nav-link active">Jugadores</a>
    <a href="asistencia.html" class="nav-link">Asistencia</a>
    <a href="tercer_tiempo.html" class="nav-link">Tercer Tiempo</a>
  </div>
</nav>
  
<div class="banner">
  <img src="encabezado4.jpeg" alt="Liceo Rugby Club Tucumán">
</div>
  
<div class="header">
  <div>
    <h2>Gestión de Jugadores</h2>
    <p class="sub">Administración del plantel</p>
  </div>

  <button class="btn-nuevo" id="btnNuevo">+ Nuevo</button>
</div>

<div class="toolbar">
  <input id="buscar" placeholder="🔍 Buscar jugador por nombre o DNI...">
  <button id="btnReload" class="btn-icon">🔄</button>
</div>

<div class="main">
  <div id="estado" class="estado"></div>
  <div id="tabla" class="tabla"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">

    <div class="modal-head">
      <h3 id="tituloModal">Nuevo Jugador</h3>
      <button id="btnCerrar" class="modal-close">✖</button>
    </div>

    <div class="modal-body">

      <input id="foto" type="file" accept="image/*">
      <img id="previewFoto" style="display:none;width:120px;height:120px;object-fit:cover;border-radius:10px;margin-top:10px;">

      <input id="dni" type="number" placeholder="DNI">
      <input id="nombre" placeholder="Nombre">
      <input id="apodo" placeholder="Apodo">
      <input id="celular" type="number" placeholder="Celular">
      <input id="correo" placeholder="Correo">

      <select id="p1">
        <option value="">Puesto 1</option>
        <option>1-PILAR IZQUIERDO</option>
        <option>2-HOOKER</option>
        <option>3-PILAR DERECHO</option>
        <option>4-SEGUNDA LINEA</option>
        <option>5-SEGUNDA LINEA</option>
        <option>6-TERCERA LINEA</option>
        <option>7-TERCERA LINEA</option>
        <option>8-TERCERA LINEA</option>
        <option>9-MEDIO SCRUM</option>
        <option>10-APERTURA</option>
        <option>11-WING</option>
        <option>12-CENTRO</option>
        <option>13-CENTRO</option>
        <option>14-WING</option>
        <option>15-FULLBACK</option>
      </select>

      <!-- PUESTO 2 -->
      <select id="p2">
        <option value="">Puesto 2</option>
        <option>1-PILAR IZQUIERDO</option>
        <option>2-HOOKER</option>
        <option>3-PILAR DERECHO</option>
        <option>4-SEGUNDA LINEA</option>
        <option>5-SEGUNDA LINEA</option>
        <option>6-TERCERA LINEA</option>
        <option>7-TERCERA LINEA</option>
        <option>8-TERCERA LINEA</option>
        <option>9-MEDIO SCRUM</option>
        <option>10-APERTURA</option>
        <option>11-WING</option>
        <option>12-CENTRO</option>
        <option>13-CENTRO</option>
        <option>14-WING</option>
        <option>15-FULLBACK</option>
      </select>

      <!-- PUESTO 3 -->
      <select id="p3">
        <option value="">Puesto 3</option>
        <option>1-PILAR IZQUIERDO</option>
        <option>2-HOOKER</option>
        <option>3-PILAR DERECHO</option>
        <option>4-SEGUNDA LINEA</option>
        <option>5-SEGUNDA LINEA</option>
        <option>6-TERCERA LINEA</option>
        <option>7-TERCERA LINEA</option>
        <option>8-TERCERA LINEA</option>
        <option>9-MEDIO SCRUM</option>
        <option>10-APERTURA</option>
        <option>11-WING</option>
        <option>12-CENTRO</option>
        <option>13-CENTRO</option>
        <option>14-WING</option>
        <option>15-FULLBACK</option>
      </select>
      <div class="acciones">
        <button id="btnGuardar" class="btn-primary">💾 Guardar</button>
      </div>

    </div>
  </div>
</div>

<!-- VER -->
<div class="modal" id="modalVer">
  <div class="modal-box">

    <div class="modal-head">
      <h3>Jugador</h3>
      <button id="btnCerrarVer" class="modal-close">✖</button>
    </div>

    <div id="detalle"></div>

    <div class="acciones">
      <button id="btnEditar">✏️ Editar</button>
      <button id="btnEliminar">🗑 Eliminar</button>
    </div>

  </div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
